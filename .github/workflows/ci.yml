name: OpenHCult CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  firmware-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run firmware host tests
        run: bash hcultfw/test/host/run_tests.sh

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install numpy pandas scipy pytest matplotlib
          pip install ./hcultinf

      - name: Run unit tests
        run: bash tests/run_unit_tests.sh

  smoke-test:
    runs-on: ubuntu-latest
    needs: [unit-tests, firmware-unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install pytest and dependencies
        run: |
          pip install pytest psycopg
          pip install ./hcultinf

      - name: Run Smoke Test Script
        env:
          OPENHCULT_COMPOSE_CMD: "docker compose"
          OPENHCULT_BASE_URL: "http://127.0.0.1:8000"
          OPENHCULT_SMOKE_TIMEOUT_S: "120"
          # CICD dummy user/pass
          OPENHCULT_SMOKE_DB_URL: "postgresql://hcult:hcult@postgres:5432/hcult"
        run: |
          chmod +x tests/run_docker_smoke_tests.py
          python3 tests/run_docker_smoke_tests.py

      - name: Cleanup on Failure
        if: failure()
        run: docker compose down -v --remove-orphans
