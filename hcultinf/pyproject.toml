[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcultinf"
version = "0.0.1"
description = "Inference helpers for openhcult"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "nobody", email = "nobody@nowhere.com" }
]

dependencies = [
    "numpy",
    "scipy",
    "emcee",
]
