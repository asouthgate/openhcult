<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenHCult Frontend</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-1: #1a1719;
        --bg-2: #1c1a23;
        --card: #1f1c24;
        --ink: #c7d7cc;
        --accent: #2e2a3a;
        --accent-2: #9fb8a9;
        --border: #2c262e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Baskerville", "Baskerville Old Face", "Garamond", "Times New Roman", serif;
        color: var(--ink);
        background: radial-gradient(1200px 600px at 10% 0%, var(--bg-2), transparent 60%),
          linear-gradient(160deg, var(--bg-1), #19151b 55%, #221c23);
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 24px;
      }

      .app {
        width: min(720px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 14px 30px rgba(18, 12, 20, 0.35);
      }

      h1 {
        margin: 0 0 8px;
        font-family: "Didot", "Bodoni MT", "Baskerville", "Times New Roman", serif;
        font-size: 1.65rem;
        letter-spacing: 0.03em;
      }

      p {
        margin: 0 0 16px;
        color: #b9d8c5;
      }

      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        margin-bottom: 16px;
      }

      label {
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 6px;
        display: block;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      select,
      input,
      textarea,
      button {
        width: 100%;
        font-family: inherit;
        font-size: 0.95rem;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #21242a;
        color: var(--ink);
      }

      textarea {
        min-height: 220px;
        resize: vertical;
        font-family: "SFMono-Regular", "Consolas", "Liberation Mono", "Courier New", monospace;
      }

      button {
        border: none;
        background: #30383a;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 14px rgba(51, 42, 66, 0.35);
      }

      .meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 12px 0 8px;
        font-size: 0.85rem;
        color: #a9bdb3;
      }

      .chip {
        padding: 6px 10px;
        border-radius: 999px;
        background: #2b242d;
        border: 1px solid #35303e;
      }

      .status {
        font-weight: 600;
        color: var(--accent-2);
      }

      @media (max-width: 520px) {
        body {
          padding: 12px;
        }

        .app {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>OpenHCult API Quick Hits</h1>
      <p>Ultra-simple UI for hitting the same endpoints as the CLI.</p>

      <div class="grid">
        <div>
          <label for="resource">Resource</label>
          <select id="resource">
            <option value="plants">/plants</option>
          </select>
        </div>
        <div>
          <label for="action">Action</label>
          <select id="action"></select>
        </div>
        <div>
          <label for="method">Method</label>
          <select id="method" disabled>
            <option value="GET">GET</option>
          </select>
        </div>
      </div>

      <div class="grid">
        <div id="plant_name_group">
          <label for="plant_name">Plant name</label>
          <input
            id="plant_name"
            type="text"
            value="office_drooping_fatsia"
            spellcheck="false"
          />
        </div>
        <div id="plant_id_group">
          <label for="plant_id">Plant id</label>
          <input id="plant_id" type="text" value="" spellcheck="false" />
        </div>
      </div>

      <label for="request_path">Request path</label>
      <input id="request_path" type="text" readonly />

      <div id="body_group">
        <label for="body">Body (JSON)</label>
        <textarea id="body" spellcheck="false"></textarea>
      </div>

      <button id="send">Send request</button>

      <div class="meta">
        <span class="chip">Request URL: <span id="request_url">-</span></span>
        <span class="chip status" id="status">Ready</span>
      </div>

      <label for="response">Response</label>
      <textarea id="response" readonly></textarea>
    </div>

    <script>
      const resourceEl = document.getElementById("resource");
      const actionEl = document.getElementById("action");
      const methodEl = document.getElementById("method");
      const plantNameEl = document.getElementById("plant_name");
      const plantIdEl = document.getElementById("plant_id");
      const plantNameGroup = document.getElementById("plant_name_group");
      const plantIdGroup = document.getElementById("plant_id_group");
      const bodyGroup = document.getElementById("body_group");
      const bodyEl = document.getElementById("body");
      const requestPathEl = document.getElementById("request_path");
      const requestUrlEl = document.getElementById("request_url");
      const statusEl = document.getElementById("status");
      const responseEl = document.getElementById("response");
      const sendButton = document.getElementById("send");

      const actions = {
        list: {
          label: "list (GET /plants)",
          method: "GET",
          path: () => "/plants",
        },
        health: {
          label: "health (GET /plants/{plant_name}/health)",
          method: "GET",
          needs: ["plant_name"],
          path: (ctx) => `/plants/${encodeURIComponent(ctx.plant_name)}/health`,
          template: (ctx) => `/plants/${ctx.plant_name || "{plant_name}"}/health`,
        },
        health_all: {
          label: "health all (GET /plants/health)",
          method: "GET",
          path: () => "/plants/health",
        },
        status_list: {
          label: "status list (GET /plants/{plant_name}/status)",
          method: "GET",
          needs: ["plant_name"],
          path: (ctx) => `/plants/${encodeURIComponent(ctx.plant_name)}/status`,
          template: (ctx) => `/plants/${ctx.plant_name || "{plant_name}"}/status`,
        },
        status_assign: {
          label: "status assign (POST /plants/{plant_name}/status)",
          method: "POST",
          needs: ["plant_name"],
          path: (ctx) => `/plants/${encodeURIComponent(ctx.plant_name)}/status`,
          template: (ctx) => `/plants/${ctx.plant_name || "{plant_name}"}/status`,
          body: { status_code: "", note: "" },
        },
        assign_sensor: {
          label: "assign sensor (POST /plants/{plant_name}/assign)",
          method: "POST",
          needs: ["plant_name"],
          path: (ctx) => `/plants/${encodeURIComponent(ctx.plant_name)}/assign`,
          template: (ctx) => `/plants/${ctx.plant_name || "{plant_name}"}/assign`,
          body: { device: "", sensor: "" },
        },
        create: {
          label: "create (POST /plants)",
          method: "POST",
          path: () => "/plants",
          body: {
            plant_name: "",
            species_id: null,
            species_name: null,
            tag: null,
            metadata: null,
          },
        },
        update: {
          label: "update (PATCH /plants/{plant_id})",
          method: "PATCH",
          needs: ["plant_id"],
          path: (ctx) => `/plants/${encodeURIComponent(ctx.plant_id)}`,
          template: (ctx) => `/plants/${ctx.plant_id || "{plant_id}"}`,
          body: {
            species_id: null,
            species_name: null,
            tag: null,
            metadata: null,
          },
        },
        delete: {
          label: "delete (DELETE /plants/{plant_name})",
          method: "DELETE",
          needs: ["plant_name"],
          path: (ctx) => `/plants/${encodeURIComponent(ctx.plant_name)}`,
          template: (ctx) => `/plants/${ctx.plant_name || "{plant_name}"}`,
        },
      };

      const buildRequest = () => {
        const actionKey = actionEl.value;
        const action = actions[actionKey];
        if (!action) {
          throw new Error("Select an action.");
        }

        const ctx = {
          plant_name: plantNameEl.value.trim(),
          plant_id: plantIdEl.value.trim(),
        };

        (action.needs || []).forEach((field) => {
          if (!ctx[field]) {
            throw new Error(`${field.replace("_", " ")} is required.`);
          }
        });

        const url = action.path(ctx);
        const method = action.method;
        let body = null;

        if (["POST", "PATCH", "PUT"].includes(method)) {
          const raw = bodyEl.value.trim();
          if (!raw) {
            throw new Error("Body JSON is required.");
          }
          try {
            body = JSON.stringify(JSON.parse(raw));
          } catch (err) {
            throw new Error("Body must be valid JSON.");
          }
        }

        return { url, method, body };
      };

      const syncRequestPath = () => {
        const action = actions[actionEl.value];
        if (!action) {
          requestPathEl.value = "";
          return;
        }
        const ctx = {
          plant_name: plantNameEl.value.trim(),
          plant_id: plantIdEl.value.trim(),
        };
        const template = action.template || action.path;
        requestPathEl.value = template(ctx);
      };

      const syncActionUI = () => {
        const action = actions[actionEl.value];
        if (!action) {
          methodEl.innerHTML = "<option value=\"GET\">GET</option>";
          plantNameGroup.style.display = "none";
          plantIdGroup.style.display = "none";
          bodyGroup.style.display = "none";
          syncRequestPath();
          return;
        }

        methodEl.innerHTML = `<option value="${action.method}">${action.method}</option>`;
        plantNameGroup.style.display =
          (action.needs || []).includes("plant_name") ? "block" : "none";
        plantIdGroup.style.display =
          (action.needs || []).includes("plant_id") ? "block" : "none";
        bodyGroup.style.display = ["POST", "PATCH", "PUT"].includes(action.method)
          ? "block"
          : "none";

        if (bodyGroup.style.display === "block") {
          const defaultBody = action.body || {};
          bodyEl.value = JSON.stringify(defaultBody, null, 2);
        } else {
          bodyEl.value = "";
        }
        syncRequestPath();
      };

      const renderResponse = (payload) => {
        if (typeof payload === "string") {
          responseEl.value = payload;
          return;
        }
        responseEl.value = JSON.stringify(payload, null, 2);
      };

      const setStatus = (text, isError = false) => {
        statusEl.textContent = text;
        statusEl.style.color = isError ? "#9b2c2c" : "#2f4f44";
      };

      Object.entries(actions).forEach(([key, value]) => {
        const option = document.createElement("option");
        option.value = key;
        option.textContent = value.label;
        actionEl.appendChild(option);
      });

      actionEl.value = "health";

      plantNameEl.addEventListener("input", syncRequestPath);
      plantIdEl.addEventListener("input", syncRequestPath);
      actionEl.addEventListener("change", syncActionUI);
      resourceEl.addEventListener("change", syncActionUI);
      syncActionUI();

      sendButton.addEventListener("click", async () => {
        responseEl.value = "";
        try {
          const { url, method, body } = buildRequest();
          requestUrlEl.textContent = url;
          setStatus(`${method} in flight...`);

          const res = await fetch(url, {
            method,
            headers: body ? { "Content-Type": "application/json" } : undefined,
            body,
          });
          const contentType = res.headers.get("content-type") || "";
          const data = contentType.includes("application/json")
            ? await res.json()
            : await res.text();

          renderResponse(data);
          setStatus(`${res.status} ${res.statusText}`);
        } catch (err) {
          renderResponse(err.message || "Request failed.");
          setStatus("Error", true);
        }
      });
    </script>
  </body>
</html>
