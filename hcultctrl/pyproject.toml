[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcultctrl"
version = "0.1.0"
description = "HTTP API for querying OpenHCult sensor readings."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "psycopg[binary]",
    "hcultdb",
    "hcultinf",
    "numpy",
    "scipy",
]

[project.scripts]
hcultctrl = "hcultctrl.__main__:main"

[tool.setuptools]
packages = ["hcultctrl"]
include-package-data = true

[tool.setuptools.package-data]
hcultctrl = ["frontend/*"]
