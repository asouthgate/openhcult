- name: Install hcultctrl systemd unit
  ansible.builtin.template:
    src: hcultctrl.service.j2
    dest: /etc/systemd/system/hcultctrl.service
    mode: "0644"
  notify:
    - reload systemd
    - restart hcultctrl

- name: Ensure hcultctrl is enabled and started
  ansible.builtin.systemd:
    name: hcultctrl
    enabled: true
    state: started
