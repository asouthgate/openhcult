- name: Install hcultctrl systemd unit
  ansible.builtin.template:
    src: hcultctrl.service.j2
    dest: /etc/systemd/system/hcultctrl.service
    mode: "0644"
  notify:
    - reload systemd
    - restart hcultctrl

- name: Initialize OpenHCult database schema
  ansible.builtin.command:
    cmd: >
      {{ openhcult_install_dir }}/.venv/bin/python -c
      "from pathlib import Path; from hcultctrl import config; from hcultdb import setup;
      config.set_config_path(Path('{{ openhcult_config_path }}'));
      setup.setup_db(config.get_db_url())"
  become_user: "{{ openhcult_user }}"

- name: Ensure hcultctrl is enabled and started
  ansible.builtin.systemd:
    name: hcultctrl
    enabled: true
    state: started

- name: Verify hcultctrl is running
  ansible.builtin.command:
    cmd: systemctl is-active --quiet hcultctrl
