openhcult_user: hcult
openhcult_group: hcult
openhcult_install_dir: /opt/openhcult
openhcult_user_shell: /bin/bash
openhcult_config_path: /opt/openhcult/openhcult.conf
openhcult_data_dir: /var/lib/openhcult
openhcult_repo_url: "git@github.com:asouthgate/openhcult.git"
openhcult_repo_version: develop
openhcult_repo_key_file: "/root/.ssh/id_rsa"
openhcult_repo_accept_hostkey: true

openhcult_ble_service_uuid: "12345678-1234-1234-1234-1234567890ab"
openhcult_ble_characteristic_uuid: "abcdefab-1234-5678-1234-abcdefabcdef"

openhcult_database_scheme: postgresql
openhcult_database_host: 127.0.0.1
openhcult_database_port: 5432
openhcult_database_name: hcult
openhcult_database_user: hcult
openhcult_database_password: ""
openhcult_database_path: "/var/lib/openhcult/sensor_readings.db"

openhcult_log_stdout: true
openhcult_log_path: /var/log/hcult
openhcult_log_file: ""

openhcult_ctrl_host: 0.0.0.0
openhcult_ctrl_port: 8000

openhcult_admin_username: admin
openhcult_admin_password: ""

openhcult_calibration_csv: /opt/openhcult/calib/calibration.csv
