- name: Install hcultmon systemd unit
  ansible.builtin.template:
    src: hcultmon.service.j2
    dest: /etc/systemd/system/hcultmon.service
    mode: "0644"
  notify:
    - reload systemd
    - restart hcultmon

- name: Ensure hcultmon is enabled and started
  ansible.builtin.systemd:
    name: hcultmon
    enabled: true
    state: started

- name: Verify hcultmon is running
  ansible.builtin.command:
    cmd: systemctl is-active --quiet hcultmon
