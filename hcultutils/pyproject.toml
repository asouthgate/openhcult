[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcultutils"
version = "0.0.1"
description = "Utilities for openhcult"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "nobody", email = "nobody@nowhere.com" }
]

dependencies = [
    "matplotlib",
    "numpy",
]

[project.scripts]
plot_timeseries = "hcultutils.plot_timeseries:main"
infer_events = "hcultutils.infer_events:main"
