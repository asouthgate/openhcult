[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcultdb"
version = "0.0.1"
description = "Database setup helpers for OpenHCult"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]",
    "bcrypt>=4.0",
]

[tool.setuptools]
packages = ["hcultdb"]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
hcultdb = ["status_types.txt", "observation_types.txt"]
