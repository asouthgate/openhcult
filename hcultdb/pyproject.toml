[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcultdb"
version = "0.0.1"
description = "Database setup helpers for OpenHCult"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "nobody", email = "nobody@nowhere.com" }
]

[tool.setuptools]
packages = ["hcultdb"]
include-package-data = true

[tool.setuptools.package-data]
hcultdb = ["status_types.txt", "observation_types.txt"]
